syntax = "proto3";

package builder;

service BuilderService {
  rpc Build(BuildRequest) returns (BuildResponse);
}

message BuildRequest {
  string build_id = 1;
}

message BuildResponse {
  string message = 1;
}

service ApiService {
  rpc BuildStarted(BuildStartedRequest) returns (BuildStartedResponse);
}

message BuildStartedRequest {
  string build_id = 1;
}

message BuildStartedResponse {
  string repo_full_name = 1;
  string project_id = 2;
  string deployment_id = 3;
  string branch = 4;
  string commit_sha = 5;
  string access_token = 6;
  string build_id = 7;
}