---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: forge-system
  labels:
    app.kubernetes.io/managed-by: forge
    app.kubernetes.io/name: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        1
        Log_Level    info
        Daemon       off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        # Containerd/kubelet write CRI-format logs (`<ts> <stream> <flag> <line>`),
        # not docker JSON. Parsing them as JSON left the whole raw line —
        # including the CRI prefix — in the message and never set `stream`,
        # so every runtime line was classified as info.
        Parser            cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  5

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    [OUTPUT]
        Name  forward
        Match *
        Host  log-router.forge-system.svc.cluster.local
        Port  8010
        # Forward protocol (msgpack over TCP) — same layout the log-router
        # implements with its Bun.listen ForwardServer.

  parsers.conf: |
    # 2026-10-11T05:54:35.879240254Z stdout F yarn run v1.22.22
    # The trailing flag (F = full, P = partial) is not part of the log line.
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) +(?<stream>stdout|stderr) +[^ ]+ +(?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

    [PARSER]
        Name docker
        Format json
        Time_Key time
        Time_Format %Y-%m-%dT%H:%M.%LZ
        Time_Keep On
