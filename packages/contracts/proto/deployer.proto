syntax = "proto3";

package deployer;

service DeployerService {
  rpc Deploy(DeployRequest) returns (DeployResponse);
  // Scale an already-deployed project's workload (pause/resume).
  rpc Scale(ScaleRequest) returns (ScaleResponse);
  // Delete a project's Kubernetes namespaces (one per deployment).
  rpc DeleteDeployments(DeleteDeploymentsRequest) returns (DeleteDeploymentsResponse);
  // Push a project's current environment variables into the env Secret of
  // its running deployments and roll the workload so pods pick them up.
  rpc SyncEnvironmentVariables(SyncEnvironmentVariablesRequest) returns (SyncEnvironmentVariablesResponse);
}

message DeployRequest {
  string deployment_id = 1;
  string project_id = 2;
  string build_id = 3;

  // Container deployments
  string image_url = 4;
  string image_tag = 5;

  // Static deployments
  string artifact_bucket = 6;
  string artifact_key = 7;

  // Detection details
  string strategy = 8;
  string framework = 9;

  // Resource plan (MiB / millicores). Requests equal limits.
  int32 cpu_millicores = 10;
  int32 memory_mb = 11;
  int32 ephemeral_storage_mb = 12;

  // When true the deployer creates an HPA instead of a fixed replica count.
  bool autoscaling_enabled = 13;
}

message DeployResponse {
  string message = 1;
}

message ScaleRequest {
  string project_id = 1;
  string deployment_id = 2;
  // Desired replica count (0 to pause, 1 to resume).
  int32 replicas = 3;
  // When true, the HPA is removed on pause and recreated on resume.
  bool autoscaling_enabled = 4;
}

message ScaleResponse {
  string message = 1;
}

message DeleteDeploymentsRequest {
  string project_id = 1;
  repeated string deployment_ids = 2;
}

message DeleteDeploymentsResponse {
  string message = 1;
}

message SyncEnvironmentVariablesRequest {
  string project_id = 1;
  // Deployments whose namespace Secret should be updated.
  repeated string deployment_ids = 2;
  // The project's full variable set, decrypted by the API.
  map<string, string> environment_variables = 3;
}

message SyncEnvironmentVariablesResponse {
  string message = 1;
  // Deployments whose namespace actually had a running workload updated.
  repeated string updated_deployment_ids = 2;
}

service DeployerApiService {
  rpc DeploymentStarted(DeploymentStartedRequest) returns (DeploymentStartedResponse);
  rpc DeploymentCompleted(DeploymentCompletedRequest) returns (DeploymentCompletedResponse);
}

message DeploymentStartedRequest {
  string deployment_id = 1;
}

message DeploymentStartedResponse {
  bool success = 1;
  string message = 2;
  // Project environment variables with decrypted values. The deployer
  // materialises them as a Kubernetes Secret in the deployment namespace and
  // injects them into the container. Only populated for container
  // deployments; the API is the only service holding ENV_ENCRYPTION_SECRET.
  map<string, string> environment_variables = 3;
}

message DeploymentCompletedRequest {
  string deployment_id = 1;
  // READY | FAILED
  string status = 2;
  string message = 3;

  // Final image reference that was deployed (optional)
  string image_url = 4;
}

message DeploymentCompletedResponse {
  bool success = 1;
  string message = 2;
}
