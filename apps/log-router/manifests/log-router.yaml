---
apiVersion: v1
kind: Namespace
metadata:
  name: forge-system
  labels:
    app.kubernetes.io/managed-by: forge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-router
  namespace: forge-system
  labels:
    app.kubernetes.io/managed-by: forge
---
apiVersion: v1
kind: Service
metadata:
  name: log-router
  namespace: forge-system
  labels:
    app.kubernetes.io/managed-by: forge
spec:
  selector:
    app: log-router
  ports:
    - name: forward
      port: 8010
      targetPort: 8010
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-router
  namespace: forge-system
  labels:
    app.kubernetes.io/managed-by: forge
spec:
  replicas: 1
  # The pod uses hostNetwork and binds a fixed host port (8010), so a rolling
  # update can never schedule the replacement pod — the old one still holds
  # the port. Recreate takes the old pod down first instead of deadlocking.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: log-router
  template:
    metadata:
      labels:
        app: log-router
        app.kubernetes.io/managed-by: forge
    spec:
      serviceAccountName: log-router
      # In production, deploy Redis as an in-cluster service and set
      # REDIS_URL to its ClusterIP (e.g. redis://redis.forge-system:6379).
      # For local kind development, hostNetwork exposes the host's Redis on
      # localhost:6379 so the pod can reach it.
      hostNetwork: true
      dnsPolicy: "ClusterFirstWithHostNet"
      enableServiceLinks: false
      containers:
        - name: log-router
          image: log-router:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8010
              name: forward
              protocol: TCP
          env:
            # Redis — used for live pub/sub + replay ring buffer.
            # Redis runs in a Docker container on the same `kind` network.
            # Find its IP with: docker inspect redis --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}'
            - name: REDIS_URL
              value: "redis://172.23.0.3:6379"
            - name: NODE_ENV
              value: "development"
            # Explicitly set LOG_ROUTER_PORT to override any Kubernetes-injected
            # service link env var of the same name.
            - name: LOG_ROUTER_PORT
              value: "8010"
            # S3 bucket + region for persisted runtime logs. These must match
            # the LOGS_BUCKET / AWS_REGION in the repo-root .env: the api reads
            # history from that bucket, so a mismatch silently hides runtime
            # logs even though they are being written.
            - name: LOGS_BUCKET
              value: "forge-project-logs"
            - name: AWS_REGION
              value: "ap-south-1"
            # Credentials for S3 log persistence. Without them every flush
            # fails with a credentials error (the receiver keeps running, but
            # runtime logs are only available live, never as history).
            #
            #   kubectl create secret generic forge-aws-credentials \
            #     -n forge-system \
            #     --from-literal=AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            #     --from-literal=AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY"
            #
            # Read from the repo-root .env so the same credentials the builder
            # and api use on the host are available in-cluster.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: forge-aws-credentials
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: forge-aws-credentials
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            # Optional: for MinIO or other S3-compatible backends
            # - name: S3_ENDPOINT
            #   value: "http://minio.forge-system:9000"
            # - name: S3_FORCE_PATH_STYLE
            #   value: "true"
          readinessProbe:
            tcpSocket:
              port: 8010
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8010
            initialDelaySeconds: 15
            periodSeconds: 20
